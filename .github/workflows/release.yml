name: Build and Release Velopack

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Get Version
        id: get_version
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            # 如果是由 tag 触发，直接从 tag 提取版本号（去掉开头的 'v'）
            $tag = "${{ github.ref_name }}"
            $ver = $tag -replace '^v', ''
            echo "VERSION=$ver" >> $env:GITHUB_ENV
            echo "TAG_NAME=$tag" >> $env:GITHUB_ENV
            Write-Host "Triggered by tag. Extracted Version: $ver from Tag: $tag"
          } else {
            # 如果是手动触发，则读取 package.json 里的版本
            $package = Get-Content package.json | ConvertFrom-Json
            echo "VERSION=$($package.version)" >> $env:GITHUB_ENV
            echo "TAG_NAME=v$($package.version)" >> $env:GITHUB_ENV
            Write-Host "Manually triggered. Read Version: $($package.version) from package.json"
          }

      - name: Build Electron Unpacked
        run: npm run build

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Rename exe to ASCII
        shell: powershell
        run: |
          Get-ChildItem "dist_electron\win-unpacked\*.exe" | ForEach-Object {
            Rename-Item $_.FullName "BiliNCM.exe"
            Write-Host "Renamed $($_.Name) to BiliNCM.exe"
          }
          Get-ChildItem "dist_electron\win-unpacked\*.exe" | Select-Object Name

      - name: Pack with Velopack
        shell: pwsh
        run: |
          chcp 65001 > $null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          vpk pack -u bilincm -v $env:VERSION -p dist_electron/win-unpacked -e BiliNCM.exe --packTitle "嗷呜点歌机" -i assets/icon.ico

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BiliNCM Release ${{ env.TAG_NAME }}"
          tag_name: "${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: Releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}