name: Build and Release Velopack

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release-r2
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Checkout connector contracts
        uses: actions/checkout@v6
        with:
          repository: Enkianssus/awoo-connectors
          ref: main
          path: BiliNCM-Connectors

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify source and production dependencies
        shell: pwsh
        run: |
          npm run lint
          npm test
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      - name: Get Version and Sync package.json
        id: get_version
        shell: powershell
        run: |
            # 1. 读取当前的 package.json（明确 UTF8，避免中文乱码）
            $package = Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json
            
            if ("${{ github.event_name }}" -eq "push") {
              $tag = "${{ github.ref_name }}"
              $ver = $tag -replace '^v', ''
              Write-Host "Triggered by tag. Extracted Version: $ver from Tag: $tag"
            } else {
              $ver = $package.version
              $tag = "v$ver"
              Write-Host "Manually triggered. Read Version: $ver from package.json"
            }
            
            # 2. 写回版本号，UTF8 无 BOM 写入
            $package.version = $ver
            $json = $package | ConvertTo-Json -Depth 100
            [System.IO.File]::WriteAllText("$PWD\package.json", $json, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "Successfully synced package.json version to: $ver"
            
            # 3. 写入 GitHub Actions 环境变量
            Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$ver"
            Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=$tag"
            $notesPath = "docs/release-notes/$tag.md"
            if (Test-Path $notesPath) {
              Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_NOTES_PATH=$notesPath"
            }
      
      - name: Build Electron Unpacked
        run: npm run build

      - name: Install Velopack CLI
        # Pinned: the delta packages were verified with this version; upgrade deliberately.
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Fetch previous release for delta packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without a usable previous release this only warns, and vpk packs the full package alone.
          node scripts/release-delta-base.mjs fetch --repository Enkianssus/AwooMusicBot --current-tag $env:TAG_NAME --tag-prefix v --min-version 1.1.0 --pack-id awoo-musicbot --channel win --output-dir Releases
          if ($LASTEXITCODE -ne 0) {
            throw "Delta base preparation failed with exit code $LASTEXITCODE"
          }

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = "dist_electron\win-unpacked\嗷呜点歌机.exe"
          if (-not (Test-Path $exe)) {
            throw "Packaged executable not found: $exe"
          }
          Get-Item $exe | Select-Object Name, Length

      - name: Pack with Velopack
        shell: pwsh
        run: |
          chcp 65001 > $null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $notesArgs = @()
          if ($env:RELEASE_NOTES_PATH) { $notesArgs = @('--releaseNotes', $env:RELEASE_NOTES_PATH) }

          # vpk's bundled zstd.exe reads its arguments in the system ANSI code page, which on
          # this English runner cannot hold 嗷呜点歌机.exe, so creating the delta fails. Merging a
          # UTF-8 activeCodePage into its manifest lets it read the paths unchanged.
          $zstd = Get-ChildItem -Path "$env:USERPROFILE\.dotnet\tools\.store\vpk" -Recurse -Filter zstd.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $mt = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($zstd -and $mt) {
            $existingManifest = Join-Path $env:RUNNER_TEMP 'zstd-existing.manifest'
            $utf8Manifest = Join-Path $env:RUNNER_TEMP 'zstd-utf8.manifest'
            [IO.File]::WriteAllText($utf8Manifest, '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><application xmlns="urn:schemas-microsoft-com:asm.v3"><windowsSettings><activeCodePage xmlns="http://schemas.microsoft.com/SMI/2019/WindowsSettings">UTF-8</activeCodePage></windowsSettings></application></assembly>')
            & $mt.FullName -nologo "-inputresource:$($zstd.FullName);#1" "-out:$existingManifest" | Out-Null
            $manifests = if ($LASTEXITCODE -eq 0 -and (Test-Path $existingManifest)) { @($existingManifest, $utf8Manifest) } else { @($utf8Manifest) }
            & $mt.FullName -nologo -manifest @manifests "-outputresource:$($zstd.FullName);#1"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::Could not give zstd.exe a UTF-8 code page; the delta may fall back to the full package."
            }
          } else {
            Write-Host "::warning::zstd.exe or mt.exe was not found; the delta may fall back to the full package."
          }

          vpk pack -u awoo-musicbot -v $env:VERSION -p dist_electron/win-unpacked -e "嗷呜点歌机.exe" --packTitle "嗷呜点歌机" -i assets/icon.ico @notesArgs
          if ($LASTEXITCODE -ne 0) {
            # A delta must never block a release: pack again exactly as before deltas existed.
            Write-Host "::warning::Packing with a delta failed; packing the full package only."
            Remove-Item -Path 'Releases' -Recurse -Force -ErrorAction SilentlyContinue
            vpk pack -u awoo-musicbot -v $env:VERSION -p dist_electron/win-unpacked -e "嗷呜点歌机.exe" --packTitle "嗷呜点歌机" -i assets/icon.ico --delta none @notesArgs
            if ($LASTEXITCODE -ne 0) {
              throw "vpk pack failed with exit code $LASTEXITCODE"
            }
          }

      - name: Keep only current-version release assets
        shell: pwsh
        run: |
          # The delta base must not be re-published or prewarmed under this tag.
          node scripts/release-delta-base.mjs prune --pack-id awoo-musicbot --version $env:VERSION --output-dir Releases
          if ($LASTEXITCODE -ne 0) {
            throw "Release asset pruning failed with exit code $LASTEXITCODE"
          }
          Get-ChildItem -Path 'Releases' -File | Select-Object Name, Length

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "嗷呜点歌机 ${{ env.TAG_NAME }}"
          tag_name: "${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: Releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prewarm release assets in R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ENKIANSSUS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 48a310efe84107a68b7ea095719805bb
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN)) {
            throw 'ENKIANSSUS_CLOUDFLARE_API_TOKEN is required for R2 prewarm.'
          }

          $wranglerVersion = '4.125.0'
          $bucket = 'awoo-download-cache'
          $releasePrefix = "github-release-v1/github.com/Enkianssus/AwooMusicBot/releases/download/$env:TAG_NAME"
          $immutableCacheControl = 'public, max-age=31536000, immutable'
          $channelCacheControl = 'public, max-age=300'

          $assets = Get-ChildItem -Path 'Releases' -File
          if (-not $assets) {
            throw 'No release assets were found in Releases/.'
          }

          foreach ($asset in $assets) {
            $contentType = switch ($asset.Extension.ToLowerInvariant()) {
              '.zip' { 'application/zip'; break }
              '.nupkg' { 'application/octet-stream'; break }
              '.json' { 'application/json; charset=utf-8'; break }
              '.sig' { 'text/plain; charset=utf-8'; break }
              '.sha256' { 'text/plain; charset=utf-8'; break }
              default { 'application/octet-stream' }
            }
            $cacheControl = if ($asset.Name -in @('RELEASES', 'assets.win.json', 'releases.win.json')) {
              $channelCacheControl
            } else {
              $immutableCacheControl
            }
            $objectPath = "$bucket/$releasePrefix/$($asset.Name)"
            $contentDisposition = 'attachment; filename="' + $asset.Name + '"'
            $arguments = @(
              '--yes',
              "wrangler@$wranglerVersion",
              'r2',
              'object',
              'put',
              $objectPath,
              '--remote',
              '--file',
              $asset.FullName,
              '--content-type',
              $contentType,
              '--content-disposition',
              $contentDisposition,
              '--cache-control',
              $cacheControl,
              '--force'
            )
            Write-Host "Prewarming R2 object $objectPath"
            & npx.cmd @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "R2 prewarm failed for $($asset.Name) with exit code $LASTEXITCODE"
            }
          }

          $tag = $env:TAG_NAME
          $releasePrefix = "github-release-v1/github.com/Enkianssus/AwooMusicBot/releases/download/$tag"
          $arguments = @(
            'scripts/cleanup-r2-release-cache.mjs',
            '--account-id', $env:CLOUDFLARE_ACCOUNT_ID,
            '--bucket', $bucket,
            '--repository', 'Enkianssus/AwooMusicBot',
            '--current-tag', $tag,
            '--tag-prefix', 'v',
            '--version-parts', '3'
          )
          foreach ($asset in $assets) {
            $arguments += @('--expected-key', "$releasePrefix/$($asset.Name)")
          }
          $verifyArguments = @($arguments)
          $verifyArguments += '--dry-run'
          & node @verifyArguments
          if ($LASTEXITCODE -ne 0) {
            throw "R2 upload verification failed for app release $tag with exit code $LASTEXITCODE"
          }
          if ($tag -notin @('v1.2.4', 'v1.2.5')) {
            & node @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "R2 cleanup failed for app release $tag with exit code $LASTEXITCODE"
            }
          }
