name: Build and Release Velopack

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Get Version
        id: get_version
        shell: powershell
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          echo "VERSION=$($package.version)" >> $env:GITHUB_ENV
          if ("${{ github.event_name }}" -eq "push") {
            echo "TAG_NAME=${{ github.ref_name }}" >> $env:GITHUB_ENV
          } else {
            echo "TAG_NAME=v$($package.version)" >> $env:GITHUB_ENV
          }

      - name: Build Electron Unpacked
        run: npm run build

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Pack with Velopack
        shell: powershell
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'
            
          # 先确认 exe 实际名称
          Write-Host "--- dist_electron/win-unpacked 目录内容 ---"
          Get-ChildItem "dist_electron/win-unpacked" -Filter "*.exe" | Select-Object Name
            
          $iconPath = Join-Path $env:GITHUB_WORKSPACE "assets\icon.ico"
          vpk pack -u bilincm -v "${{ env.VERSION }}" -p "dist_electron/win-unpacked" -e "直播点歌机.exe" -i "$iconPath"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BiliNCM Release ${{ env.TAG_NAME }}"
          tag_name: "${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: Releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}