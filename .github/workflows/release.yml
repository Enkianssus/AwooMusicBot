name: Debug Build

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  debug:
    runs-on: windows-latest

    steps:
      # 1️⃣ 拉代码（关键：确保不是旧commit）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Node环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3️⃣ 打印环境信息
      - name: Print environment
        run: |
          node -v
          npm -v
          echo "==== Current directory ===="
          dir

      # 4️⃣ 查看所有 vite config（关键）
      - name: Find vite configs
        run: |
          echo "==== vite.config.* ===="
          dir vite.config.*

      # 5️⃣ 打印 vite config 内容（关键）
      - name: Print vite config
        run: |
          echo "==== vite.config.ts ===="
          type vite.config.ts

      # 6️⃣ 安装依赖（锁死版本）
      - name: Install dependencies
        run: npm ci

      # 7️⃣ 检查依赖树（查 import_simple 来源）
      - name: Check dependencies
        run: |
          npm ls vite
          npm ls vite-plugin-electron
          npm ls

      # 8️⃣ 预编译 TS（排查编译问题）
      - name: Type check
        run: npx tsc --noEmit

      # 9️⃣ 单独跑 vite build（不跑 electron）
      - name: Vite build only
        run: npx vite build --debug

      # 🔟 完整 build（最终复现）
      - name: Full build
        run: npm run build