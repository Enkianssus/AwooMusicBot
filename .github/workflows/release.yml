name: Build and Release Velopack

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Get Version and Sync package.json
        id: get_version
        shell: powershell
        run: |
          # 1. 读取当前的 package.json
          $package = Get-Content package.json -Raw | ConvertFrom-Json

          if ("${{ github.event_name }}" -eq "push") {
            # 如果是由 tag 触发，直接从 tag 提取版本号（去掉开头的 'v'）
            $tag = "${{ github.ref_name }}"
            $ver = $tag -replace '^v', ''
            Write-Host "Triggered by tag. Extracted Version: $ver from Tag: $tag"
          } else {
            # 如果是手动触发，则读取 package.json 里的版本
            $ver = $package.version
            $tag = "v$ver"
            Write-Host "Manually triggered. Read Version: $ver from package.json"
          }

          # 2. 【核心修复】将真实的打包版本号强行写回到 package.json 中！
          # 使用 UTF8 无 BOM 写入，避免 PostCSS / JSON.parse 读到 BOM 报错
          $package.version = $ver
          $json = $package | ConvertTo-Json -Depth 100
          [System.IO.File]::WriteAllText("$PWD\package.json", $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Successfully synced package.json version to: $ver"

          # 3. 写入 GitHub Actions 环境变量
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$ver"
          Add-Content -Path $env:GITHUB_ENV -Value "TAG_NAME=$tag"

      - name: Build Electron Unpacked
        run: npm run build

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Rename exe to ASCII
        shell: powershell
        run: |
          Get-ChildItem "dist_electron\win-unpacked\*.exe" | ForEach-Object {
            Rename-Item $_.FullName "BiliNCM.exe"
            Write-Host "Renamed $($_.Name) to BiliNCM.exe"
          }
          Get-ChildItem "dist_electron\win-unpacked\*.exe" | Select-Object Name

      - name: Pack with Velopack
        shell: pwsh
        run: |
          chcp 65001 > $null
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          vpk pack -u bilincm -v $env:VERSION -p dist_electron/win-unpacked -e BiliNCM.exe --packTitle "嗷呜点歌机" -i assets/icon.ico

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BiliNCM Release ${{ env.TAG_NAME }}"
          tag_name: "${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: Releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}